[workspace]
members = [".", "crates/foliate-core"]
resolver = "2"

[package]
name = "wolidate"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "wolidate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
foliate-core = { path = "crates/foliate-core" }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "fs", "sync", "macros"] }
thiserror = "2.0"
http = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "rustls-tls-native-roots"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
percent-encoding = "2"
url = "2"
keyring-core = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
tauri-plugin-android-fs = "31.0.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
